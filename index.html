<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقييم حسابات فري فاير</title>
    <!-- استيراد خط Cairo من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            min-height: 100vh;
        }

        /* شريط التحميل العلوي */
        #loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loader-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .progress-bar-wrapper {
            width: 300px;
            height: 12px;
            border: 2px solid #000000;
            border-radius: 6px;
            overflow: hidden;
            background: #fff;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #000000;
            transition: width 0.1s linear;
        }

        /* محتوى الموقع الأساسي */
        .main-content {
            display: none;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #000;
            padding-bottom: 15px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
        }

        /* النماذج (Forms) */
        .card {
            border: 2px solid #000;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            background: #fff;
        }

        .card h2 {
            margin-bottom: 15px;
            font-size: 20px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid #000;
            border-radius: 5px;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            outline: none;
        }

        button {
            background-color: #000;
            color: #fff;
            border: 2px solid #000;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
            transition: 0.2s;
        }

        button:hover {
            background-color: #fff;
            color: #000;
        }

        /* إخفاء وإظهار الأقسام */
        .hidden {
            display: none !important;
        }

        /* شبكة الحسابات المنشورة */
        .posts-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .post-card {
            border: 2px solid #000;
            padding: 15px;
            border-radius: 8px;
        }

        .post-card img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border: 2px solid #000;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .rating-section {
            margin-top: 10px;
            border-top: 1px dashed #000;
            padding-top: 10px;
        }

        .stars-select {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .star-btn {
            width: 30px;
            height: 30px;
            background: #fff;
            color: #000;
            border: 1px solid #000;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
        }

        .star-btn.active, .star-btn:hover {
            background: #000;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- شريط التحميل -->
    <div id="loader-container">
        <div class="loader-title">جاري تحميل الموقع...</div>
        <div class="progress-bar-wrapper">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <!-- محتوى الموقع -->
    <div class="main-content" id="mainContent">
        <header>
            <h1>تقييم حسابات فري فاير 🔥</h1>
        </header>

        <!-- 1. صفحة تسجيل الدخول الوهمية -->
        <div class="card" id="loginCard">
            <h2>تسجيل الدخول إلى حسابك</h2>
            <input type="text" id="loginName" placeholder="اسمك في اللعبة">
            <input type="text" id="loginId" placeholder="الإي دي (ID)">
            <input type="password" id="loginPass" placeholder="كلمة المرور">
            <button onclick="handleLogin()">تسجيل الدخول</button>
        </div>

        <!-- 2. صفحة إضافة حساب جديد (تظهر بعد تسجيل الدخول) -->
        <div class="card hidden" id="postCard">
            <h2>إضافة حساب جديد للتقييم</h2>
            <input type="file" id="accImage" accept="image/*">
            <input type="text" id="accId" placeholder="آي دي الحساب (ID)">
            <input type="text" id="accSocial" placeholder="روابط حساباتك (تيك توك / انستا...)">
            <button onclick="publishAccount()">نشر الحساب</button>
        </div>

        <!-- 3. معرض الحسابات والتقييمات -->
        <div class="card">
            <h2>الحسابات المضافة للتقييم</h2>
            <div class="posts-grid" id="postsContainer">
                <!-- سيتم إضافة المنشورات هنا ديناميكياً -->
            </div>
        </div>
    </div>

    <script>
        // محاكاة شريط التحميل (من 0 إلى 100 في ثانية واحدة)
        let width = 0;
        const bar = document.getElementById('progressBar');
        const loader = document.getElementById('loader-container');
        const mainContent = document.getElementById('mainContent');

        const interval = setInterval(() => {
            if (width >= 100) {
                clearInterval(interval);
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                    mainContent.style.display = 'block';
                }, 500);
            } else {
                width += 2; // يكتمل بسرعة (خلال ثانية تقريباً)
                bar.style.width = width + '%';
            }
        }, 15);

        // التعامل مع تسجيل الدخول
        function handleLogin() {
            const name = document.getElementById('loginName').value;
            const id = document.getElementById('loginId').value;
            if(!name || !id) {
                alert('الرجاء إدخال البيانات الأساسية!');
                return;
            }
            alert('تم تسجيل الدخول بنجاح!');
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('postCard').classList.remove('hidden');
        }

        // نشر الحساب
        function publishAccount() {
            const id = document.getElementById('accId').value;
            const social = document.getElementById('accSocial').value;
            const imageInput = document.getElementById('accImage');

            if(!id) {
                alert('الرجاء إدخال آي دي الحساب على الأقل!');
                return;
            }

            // قراءة الصورة المرفوعة
            let imageUrl = "https://via.placeholder.com/400x200?text=Free+Fire+Account"; // صورة افتراضية
            if (imageInput.files && imageInput.files[0]) {
                imageUrl = URL.createObjectURL(imageInput.files[0]);
            }

            const container = document.getElementById('postsContainer');
            
            const postHTML = `
                <div class="post-card">
                    <img src="${imageUrl}" alt="صورة الحساب">
                    <p><strong>الآي دي:</strong> ${id}</p>
                    <p><strong>حسابات التواصل:</strong> ${social || 'لا يوجد'}</p>
                    
                    <div class="rating-section">
                        <p><strong>قيم هذا الحساب (من 1 إلى 10):</strong></p>
                        <div class="stars-select">
                            <button class="star-btn" onclick="rate(this, 1)">1</button>
                            <button class="star-btn" onclick="rate(this, 2)">2</button>
                            <button class="star-btn" onclick="rate(this, 3)">3</button>
                            <button class="star-btn" onclick="rate(this, 4)">4</button>
                            <button class="star-btn" onclick="rate(this, 5)">5</button>
                            <button class="star-btn" onclick="rate(this, 6)">6</button>
                            <button class="star-btn" onclick="rate(this, 7)">7</button>
                            <button class="star-btn" onclick="rate(this, 8)">8</button>
                            <button class="star-btn" onclick="rate(this, 9)">9</button>
                            <button class="star-btn" onclick="rate(this, 10)">10</button>
                        </div>
                        <p class="avg-rating">التقييم الحالي: <span>لم يتم التقييم بعد</span></p>
                        <textarea placeholder="اكتب تعليقك هنا..." style="margin-top:5px; height: 60px;"></textarea>
                        <button onclick="submitComment(this)">إرسال التقييم والتعليق</button>
                        <div class="comments-list" style="margin-top: 10px; font-size: 13px;"></div>
                    </div>
                </div>
            `;

            container.innerHTML += postHTML;
            alert('تم نشر حسابك بنجاح على الموقع!');
            
            // تفريغ الحقول
            document.getElementById('accId').value = '';
            document.getElementById('accSocial').value = '';
            document.getElementById('accImage').value = '';
        }

        // نظام اختيار التقييم بالضغط على الأزرار
        function rate(btn, score) {
            const parent = btn.closest('.rating-section');
            parent.querySelectorAll('.star-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            parent.dataset.selectedScore = score;
        }

        // إرسال التعليق والتقييم
        function submitComment(button) {
            const section = button.closest('.rating-section');
            const score = section.dataset.selectedScore;
            const commentText = section.querySelector('textarea').value;
            const commentsList = section.querySelector('.comments-list');
            const avgDisplay = section.querySelector('.avg-rating span');

            if(!score) {
                alert('الرجاء اختيار تقييم من 1 إلى 10 أولاً!');
                return;
            }

            avgDisplay.textContent = score + " / 10";

            if(commentText.trim() !== "") {
                const commentItem = document.createElement('div');
                commentItem.style.borderTop = "1px solid #ddd";
                commentItem.style.padding = "5px 0";
                commentItem.innerHTML = `⭐ <b>${score}/10</b>: ${commentText}`;
                commentsList.appendChild(commentItem);
                section.querySelector('textarea').value = '';
            }
            
            alert('تم إرسال تقييمك بنجاح!');
        }
    </script>
</body>
</html>

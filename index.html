<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرر الأكواد السريع</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h2 {
            margin-bottom: 20px;
            font-weight: 900;
            font-size: 28px;
            letter-spacing: 1px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        label {
            font-weight: 700;
            font-size: 18px;
        }
        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            background-color: #111111;
            border: 2px solid #333333;
            color: #ffffff;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            resize: vertical;
            outline: none;
            transition: 0.3s;
        }
        textarea:focus {
            border-color: #ffffff;
        }
        button {
            padding: 14px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #cccccc;
        }
        button:disabled {
            background-color: #555555;
            cursor: not-allowed;
        }
        .result-box {
            background-color: #111111;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #333333;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }
        .link-display {
            word-break: break-all;
            color: #00ff88;
            font-size: 16px;
            font-weight: 700;
            direction: ltr;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>محرر الأكواد المتقدم</h2>

    <div class="container">
        <div>
            <label for="codeEditor">الكود البرمجي (HTML/CSS/JS):</label>
            <textarea id="codeEditor" placeholder="اكتب أو الصق الكود الخاص بك هنا..."></textarea>
        </div>

        <button id="submitBtn" onclick="generateSite()">توليد الموقع واستضافة الرابط</button>

        <div class="result-box" id="resultSection" style="display: none;">
            <label>رابط موقعك الحقيقي:</label>
            <div class="link-display" id="generatedLink"></div>
            <button onclick="openLiveSite()" style="background-color: #222; color: #fff; border: 1px solid #fff;">فتح الموقع في صفحة جديدة</button>
            <button onclick="copyLink()" style="background-color: #333; color: #fff; border: 1px solid #fff;">نسخ الرابط</button>
        </div>
    </div>

    <script>
        let finalUrl = "";

        async function generateSite() {
            const codeContent = document.getElementById('codeEditor').value;
            const submitBtn = document.getElementById('submitBtn');

            if (!codeContent.trim()) {
                alert("الرجاء كتابة أو لصق الكود البرمجي!");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "جاري رفع الكود وتوليد الرابط...";

            try {
                // رفع الكود كملف HTML سحابياً عبر Bytebin API
                const response = await fetch('https://bytebin.lucko.me/post', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/html; charset=utf-8'
                    },
                    body: codeContent
                });

                if (!response.ok) {
                    throw new Error('فشل الرفع');
                }

                const data = await response.json();
                const pasteId = data.key;

                // توليد الرابط القصير المباشر
                finalUrl = `https://bytebin.lucko.me/${pasteId}`;

                // عرض النتيجة
                document.getElementById('generatedLink').innerText = finalUrl;
                document.getElementById('resultSection').style.display = 'flex';

            } catch (error) {
                alert("حدث خطأ أثناء رفع الكود، يرجى المحاولة مرة أخرى.");
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "توليد الموقع واستضافة الرابط";
            }
        }

        function openLiveSite() {
            if (finalUrl) {
                window.open(finalUrl, '_blank');
            }
        }

        function copyLink() {
            if (!finalUrl) return;
            navigator.clipboard.writeText(finalUrl).then(() => {
                alert("تم نسخ الرابط بنجاح! يمكنك إرساله لأي شخص الآن.");
            });
        }
    </script>

</body>
</html>

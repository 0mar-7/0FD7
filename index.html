<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة Social Media - تخصيص صفحتك الشخصية</title>
    <!-- استيراد خط Cairo بجميع الأوزان -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif !important;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            width: 90%;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        input[type="text"], input[type="url"], input[type="color"], input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
        }

        input[type="color"] {
            height: 50px;
            cursor: pointer;
        }

        input[type="file"] {
            background: #fafafa;
            cursor: pointer;
        }

        /* تنسيق لوحة الألوان الـ 20 الجاهزة */
        .color-palette {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .color-swatch {
            width: 100%;
            height: 35px;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }

        .color-swatch:hover {
            transform: scale(1.1);
            border-color: #333;
        }

        .platforms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .platform-input {
            display: flex;
            flex-direction: column;
            background: #fafafa;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .platform-input label {
            font-size: 14px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: 700;
            transition: background 0.3s;
            font-family: 'Cairo', sans-serif;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .btn-secondary {
            background-color: #2ecc71;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background-color: #27ae60;
        }

        /* تنسيق صفحة البروفايل المولدة */
        #profile-view {
            display: none;
            text-align: center;
            padding: 40px 20px;
            flex-grow: 1;
            background-color: #121212; /* خلفية ثابتة سودة داكنة */
        }

        .profile-header img {
            width: 130px;
            height: 130px;
            border-radius: 12px;
            object-fit: cover;
            border: 5px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 15px;
        }

        .profile-header h2 {
            font-size: 28px;
            margin-bottom: 25px;
            font-weight: 700;
        }

        .social-links-list {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .social-link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 22px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s, opacity 0.2s;
        }

        .social-link-item:hover {
            transform: translateY(-3px);
            opacity: 0.95;
        }

        .social-link-item i {
            font-size: 20px;
        }

        .share-box {
            margin-top: 25px;
            background: rgba(255, 255, 255, 0.08);
            padding: 15px;
            border-radius: 8px;
            word-break: break-all;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        footer {
            text-align: center;
            padding: 15px;
            background-color: #2c3e50;
            color: white;
            font-size: 14px;
            font-weight: 600;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- لوحة التحكم / إنشاء الصفحة -->
    <div class="container" id="generator-container">
        <h1>منصة Social Media - أنشئ صفحتك</h1>
        <form id="profileForm">
            <div class="form-group">
                <label for="pageName">اسم المستخدم أو اسم الصفحة:</label>
                <input type="text" id="pageName" required placeholder="مثال: Ahmed Ali">
            </div>

            <div class="form-group">
                <label for="textColorPicker">اختر لون الكتابة والخطوط:</label>
                <input type="color" id="textColorPicker" value="#3498db">
                
                <!-- 20 لون مختلف لاختيار لون الكتابة بسرعة -->
                <label style="margin-top: 10px; font-size: 13px; color: #777;">أو اختر من الـ 20 لوناً الجاهزة التالية:</label>
                <div class="color-palette">
                    <div class="color-swatch" style="background: #3498db;" onclick="setPickerColor('#3498db')"></div>
                    <div class="color-swatch" style="background: #e74c3c;" onclick="setPickerColor('#e74c3c')"></div>
                    <div class="color-swatch" style="background: #2ecc71;" onclick="setPickerColor('#2ecc71')"></div>
                    <div class="color-swatch" style="background: #f1c40f;" onclick="setPickerColor('#f1c40f')"></div>
                    <div class="color-swatch" style="background: #9b59b6;" onclick="setPickerColor('#9b59b6')"></div>
                    <div class="color-swatch" style="background: #1abc9c;" onclick="setPickerColor('#1abc9c')"></div>
                    <div class="color-swatch" style="background: #e67e22;" onclick="setPickerColor('#e67e22')"></div>
                    <div class="color-swatch" style="background: #e84393;" onclick="setPickerColor('#e84393')"></div>
                    <div class="color-swatch" style="background: #00cec9;" onclick="setPickerColor('#00cec9')"></div>
                    <div class="color-swatch" style="background: #fdcb6e;" onclick="setPickerColor('#fdcb6e')"></div>
                    <div class="color-swatch" style="background: #ff7675;" onclick="setPickerColor('#ff7675')"></div>
                    <div class="color-swatch" style="background: #74b9ff;" onclick="setPickerColor('#74b9ff')"></div>
                    <div class="color-swatch" style="background: #55efc4;" onclick="setPickerColor('#55efc4')"></div>
                    <div class="color-swatch" style="background: #a29bfe;" onclick="setPickerColor('#a29bfe')"></div>
                    <div class="color-swatch" style="background: #dfe6e9;" onclick="setPickerColor('#dfe6e9')"></div>
                    <div class="color-swatch" style="background: #ffeaa7;" onclick="setPickerColor('#ffeaa7')"></div>
                    <div class="color-swatch" style="background: #fab1a0;" onclick="setPickerColor('#fab1a0')"></div>
                    <div class="color-swatch" style="background: #ff4757;" onclick="setPickerColor('#ff4757')"></div>
                    <div class="color-swatch" style="background: #2ed573;" onclick="setPickerColor('#2ed573')"></div>
                    <div class="color-swatch" style="background: #1e90ff;" onclick="setPickerColor('#1e90ff')"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="profileImage">اختر الصورة الشخصية من المعرض:</label>
                <input type="file" id="profileImage" accept="image/*">
            </div>

            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
            
            <label style="margin-bottom: 15px;">أضف روابط حساباتك:</label>
            <div class="platforms-grid" id="platformsContainer">
                <div class="platform-input"><label><i class="fab fa-youtube" style="color:red"></i> YouTube</label><input type="url" data-platform="YouTube" data-color="#ff0000" placeholder="رابط الحساب"></div>
                <div class="platform-input"><label><i class="fab fa-tiktok"></i> TikTok</label><input type="url" data-platform="TikTok" data-color="#000000" placeholder="رابط الحساب"></div>
                <div class="platform-input"><label><i class="fab fa-twitch" style="color:purple"></i> Twitch</label><input type="url" data-platform="Twitch" data-color="#9146ff" placeholder="رابط الحساب"></div>
                <div class="platform-input"><label><i class="fab fa-vimeo" style="color:#1ab7ea"></i> Vimeo</label><input type="url" data-platform="Vimeo" data-color="#1ab7ea" placeholder="رابط الحساب"></div>
                <div class="platform-input"><label><i class="fab fa-facebook" style="color:#1877f2"></i> Facebook</label><input type="url" data-platform="Facebook" data-color="#1877f2" placeholder="رابط الحساب"></div>
                <div class="platform-input"><label><i class="fab fa-instagram" style="color:#e4405f"></i> Instagram</label><input type="url" data-platform="Instagram" data-color="#e4405f" placeholder="رابط الحساب"></div>
                <div class="platform-input"><label><i class="fa-solid fa-x"></i> X (Twitter)</label><input type="url" data-platform="X_Twitter" data-color="#ffffff" placeholder="رابط الحساب"></div>
                <div class="platform-input"><label><i class="fab fa-threads"></i> Threads</label><input type="url" data-platform="Threads" data-color="#000000" placeholder="رابط الحساب"></div>
                <div class="platform-input"><label><i class="fab fa-snapchat" style="color:#e6df00"></i> Snapchat</label><input type="url" data-platform="Snapchat" data-color="#fffc00" placeholder="رابط الحساب"></div>
                <div class="platform-input"><label><i class="fab fa-discord" style="color:#5865f2"></i> Discord</label><input type="url" data-platform="Discord" data-color="#5865f2" placeholder="رابط الحساب"></div>
                <div class="platform-input"><label><i class="fab fa-facebook-messenger" style="color:#0084ff"></i> Messenger</label><input type="url" data-platform="Facebook Messenger" data-color="#0084ff" placeholder="رابط الحساب"></div>
                <div class="platform-input"><label><i class="fab fa-telegram" style="color:#229ed9"></i> Telegram</label><input type="url" data-platform="Telegram" data-color="#229ed9" placeholder="رابط الحساب"></div>
                <div class="platform-input"><label><i class="fab fa-whatsapp" style="color:#25d366"></i> WhatsApp</label><input type="url" data-platform="WhatsApp" data-color="#25d366" placeholder="رابط الحساب"></div>
                <div class="platform-input"><label><i class="fab fa-pinterest" style="color:#bd081c"></i> Pinterest</label><input type="url" data-platform="Pinterest" data-color="#bd081c" placeholder="رابط الحساب"></div>
                <div class="platform-input"><label><i class="fab fa-reddit" style="color:#ff4500"></i> Reddit</label><input type="url" data-platform="Reddit" data-color="#ff4500" placeholder="رابط الحساب"></div>
            </div>

            <button type="button" class="btn btn-secondary" onclick="addCustomPlatform()">+ إضافة منصة أخرى</button>
            <br><br>
            <button type="submit" class="btn">توليد الصفحة</button>
        </form>
    </div>

    <!-- عرض الصفحة الشخصية بعد التوليد -->
    <div id="profile-view">
        <div class="profile-header">
            <img id="viewImage" src="" alt="صورة الملف الشخصي">
            <h2 id="viewName">اسم المستخدم</h2>
        </div>
        <div class="social-links-list" id="viewLinks"></div>
        <div class="share-box">
            <p style="font-weight: 600;" id="shareText">تم توليد صفحتك بنجاح! شارك الرابط:</p>
            <input type="text" id="shareUrl" readonly style="margin-top: 8px; text-align: center; background: #222; color: #fff; border: 1px solid #444;">
        </div>
        <br>
        <button class="btn" style="max-width: 200px; margin: 0 auto; background-color: #333;" onclick="location.reload()">إنشاء صفحة جديدة</button>
    </div>

    <!-- حقوق النشر -->
    <footer>
        جميع الحقوق محفوظة &copy; 2026 Social Media Platform
    </footer>

    <script>
        // دالة لتغيير لون حقل اختيار الألوان عبر النقر على إحدى الألوان الـ 20
        function setPickerColor(hex) {
            document.getElementById("textColorPicker").value = hex;
        }

        // دالة لتحديد لون نص متباين (أسود أو أبيض) حسب إضاءة لون الزر الخاص بالمنصة لضمان وضوح القراءة
        function getContrastYIQ(hexcolor){
            if (!hexcolor || hexcolor.startsWith('rgb')) return '#ffffff';
            hexcolor = hexcolor.replace("#", "");
            if(hexcolor.length === 3) {
                hexcolor = hexcolor.split('').map(c => c + c).join('');
            }
            var r = parseInt(hexcolor.substr(0,2),16);
            var g = parseInt(hexcolor.substr(2,2),16);
            var b = parseInt(hexcolor.substr(4,2),16);
            var yiq = (r * 299 + g * 587 + b * 114) / 1000;
            return (yiq >= 150) ? '#000000' : '#ffffff';
        }

        function addCustomPlatform() {
            const platformName = prompt("أدخل اسم المنصة الجديدة:");
            if (platformName && platformName.trim() !== "") {
                const container = document.getElementById("platformsContainer");
                const div = document.createElement("div");
                div.className = "platform-input";
                div.innerHTML = `<label><i class="fas fa-globe"></i> ${platformName.trim()}</label><input type="url" data-platform="${platformName.trim()}" data-color="#3498db" placeholder="رابط الحساب">`;
                container.appendChild(div);
            }
        }

        document.getElementById("profileForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const name = document.getElementById("pageName").value;
            const textColor = document.getElementById("textColorPicker").value; // لون الكتابة المختار
            const imageInput = document.getElementById("profileImage");
            
            const processProfile = (imageSrc) => {
                const inputs = document.querySelectorAll(".platforms-grid input[type='url']");
                const linksData = [];

                inputs.forEach(input => {
                    const url = input.value.trim();
                    const platform = input.getAttribute("data-platform");
                    const platformColor = input.getAttribute("data-color") || "#3498db";
                    if (url) {
                        linksData.push({ platform, url, color: platformColor });
                    }
                });

                document.getElementById("generator-container").style.display = "none";
                const profileView = document.getElementById("profile-view");
                profileView.style.display = "block";

                // تعيين اسم المستخدم ولونه المختار بالكامل
                const viewName = document.getElementById("viewName");
                viewName.innerText = name;
                viewName.style.color = textColor;
                
                // تعيين لون إطار الصورة الشخصية بلون الكتابة المختار
                const viewImage = document.getElementById("viewImage");
                viewImage.src = imageSrc;
                viewImage.style.border = `5px solid ${textColor}`;

                // تلوين نصوص مربع المشاركة بلون الكتابة المختار
                document.getElementById("shareText").style.color = textColor;

                const linksContainer = document.getElementById("viewLinks");
                linksContainer.innerHTML = "";

                if(linksData.length === 0) {
                    linksContainer.innerHTML = `<p style='color: ${textColor}; font-weight: 600;'>لم تقم بإضافة أي روابط تواصل اجتماعي.</p>`;
                } else {
                    linksData.forEach(item => {
                        const a = document.createElement("a");
                        a.href = item.url;
                        a.target = "_blank";
                        a.className = "social-link-item";
                        // جعل خلفية زر كل منصة بلونها الخاص ورسم النص بلون متناسق ومقروء
                        a.style.backgroundColor = item.color;
                        const itemTextColor = getContrastYIQ(item.color);
                        a.style.color = itemTextColor;
                        a.innerHTML = `<span>${item.platform}</span> <i class="fas fa-external-link-alt" style="color: ${itemTextColor};"></i>`;
                        linksContainer.appendChild(a);
                    });
                }

                const generatedShareUrl = window.location.href.split('?')[0] + "?user=" + encodeURIComponent(name);
                document.getElementById("shareUrl").value = generatedShareUrl;
            };

            if (imageInput.files && imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    processProfile(event.target.result);
                };
                reader.readAsDataURL(imageInput.files[0]);
            } else {
                const defaultImage = "https://via.placeholder.com/150/2c3e50/ffffff?text=" + name.charAt(0);
                processProfile(defaultImage);
            }
        });
    </script>
</body>
</html>

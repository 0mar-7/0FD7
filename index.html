<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرر الأكواد السريع</title>
    <!-- استدعاء خط Cairo العريض -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h2 {
            margin-bottom: 20px;
            font-weight: 900;
            font-size: 28px;
            letter-spacing: 1px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        label {
            font-weight: 700;
            font-size: 18px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: #111111;
            border: 2px solid #333333;
            color: #ffffff;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            outline: none;
            transition: 0.3s;
        }
        input[type="text"]:focus {
            border-color: #ffffff;
        }
        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            background-color: #111111;
            border: 2px solid #333333;
            color: #ffffff;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            resize: vertical;
            outline: none;
            transition: 0.3s;
        }
        textarea:focus {
            border-color: #ffffff;
        }
        button {
            padding: 14px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #cccccc;
        }
        .result-box {
            background-color: #111111;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #333333;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }
        .link-display {
            word-break: break-all;
            color: #aaaaaa;
            font-size: 14px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <h2>محرر الأكواد المتقدم</h2>

    <div class="container">
        <div>
            <label for="siteName">اسم الموقع:</label>
            <input type="text" id="siteName" placeholder="اكتب اسم الموقع هنا (مثال: my-page)">
        </div>

        <div>
            <label for="codeEditor">الكود البرمجي (HTML/CSS/JS):</label>
            <textarea id="codeEditor" placeholder="اكتب أو الصق الكود الخاص بك هنا..."></textarea>
        </div>

        <button onclick="generateSite()">توليد الموقع</button>

        <div class="result-box" id="resultSection" style="display: none;">
            <label>رابط موقعك المتولد:</label>
            <div class="link-display" id="generatedLink"></div>
            <button onclick="openLiveSite()" style="background-color: #222; color: #fff; border: 1px solid #fff;">فتح الموقع في صفحة جديدة</button>
            <button onclick="copyLink()" style="background-color: #333; color: #fff; border: 1px solid #fff;">نسخ الرابط</button>
        </div>
    </div>

    <script>
        let finalUrl = "";

        function generateSite() {
            const siteNameInput = document.getElementById('siteName').value.trim();
            const codeContent = document.getElementById('codeEditor').value;

            if (!siteNameInput) {
                alert("الرجاء كتابة اسم الموقع أولاً!");
                return;
            }

            if (!codeContent) {
                alert("الرجاء كتابة أو لصق الكود البرمجي!");
                return;
            }

            // تجهيز الرابط بالشكل المطلوب
            finalUrl = `https://0mar-7.github.io/0FD7/${encodeURIComponent(siteNameInput)}`;

            // حفظ الكود محلياً بحيث لو تم فتح الرابط أو معاينته يظهر المحتوى المكتوب
            localStorage.setItem(`code_${siteNameInput}`, codeContent);

            // عرض النتيجة للمستخدم
            document.getElementById('generatedLink').innerText = finalUrl;
            document.getElementById('resultSection').style.display = 'flex';

            // محاكاة فتح المعاينة فوراً بملء الشاشة كما طلبت
            setTimeout(() => {
                openLiveSite();
            }, 500);
        }

        function openLiveSite() {
            if (!finalUrl) return;
            const siteNameInput = document.getElementById('siteName').value.trim();
            const savedCode = localStorage.getItem(`code_${siteNameInput}`) || "<h1>لا يوجد محتوى</h1>";

            // فتح صفحة جديدة تعرض الموقع لوحده بدون محرر الأكواد وبملء الشاشة
            const newWindow = window.open('', '_blank');
            newWindow.document.write(savedCode);
            newWindow.document.close();
        }

        function copyLink() {
            if (!finalUrl) return;
            navigator.clipboard.writeText(finalUrl).then(() => {
                alert("تم نسخ الرابط بنجاح!");
            });
        }
    </script>

</body>
</html>
